server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/diary_db?useSSL=true&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  jackson:
    serialization:
      write-dates-as-timestamps: false
    date-format: com.fasterxml.jackson.databind.util.StdDateFormat

app:
  security:
    bcrypt-cost: 12
    session-max-age: 604800
  kdf:
    default-algorithm: pbkdf2-sha256
    default-iterations: 600000
    min-iterations: 100000
  upload:
    base-path: attachments
    max-file-size-mb: 10
    max-per-entry: 20
    unattached-ttl-hours: 24
  rate-limit:
    login-per-minute: 5
    register-per-hour: 3
    recovery-per-minute: 5
    api-per-minute: 60
    attachment-per-minute: 10

logging:
  level:
    root: INFO
    com.diary: DEBUG
