spring:
  datasource:
    url: jdbc:h2:mem:diary_test;MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    database-platform: org.hibernate.dialect.H2Dialect
    properties:
      hibernate:
        format_sql: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

app:
  security:
    bcrypt-cost: 4
    session-max-age: 604800
  kdf:
    default-algorithm: pbkdf2-sha256
    default-iterations: 600000
    min-iterations: 100000
  upload:
    base-path: ./target/test-uploads
    max-file-size-mb: 10
    max-per-entry: 20
    unattached-ttl-hours: 24
  rate-limit:
    login-per-minute: 100
    register-per-hour: 100
    recovery-per-minute: 100
    api-per-minute: 1000
    attachment-per-minute: 100

logging:
  level:
    root: WARN
    com.diary: INFO
